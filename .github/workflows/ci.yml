# Runs on every push and pull request.
#
# Cloudflare does its OWN build and deploy (connected directly to this repo),
# so this workflow does not deploy anything. Its job is to catch mistakes
# BEFORE they reach the live site: if the build breaks or a link is dead, you
# get a red X on the commit.

name: Build & check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build site and validate output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: Check every source page produced an output file
        run: |
          node -e '
            const fs = require("fs"), path = require("path");

            // Work out what SHOULD exist by reading the slug from each page
            // source, rather than hardcoding a list. Adding or removing a page
            // then needs no change here.
            const expected = fs.readdirSync("src/pages")
              .filter((f) => f.endsWith(".html"))
              .map((f) => {
                const src = fs.readFileSync(path.join("src/pages", f), "utf8");
                const fm = src.match(/^<!--\s*([\s\S]*?)\s*-->/);
                if (!fm) throw new Error(`${f} has no front-matter block`);
                const { slug } = JSON.parse(fm[1]);
                if (slug === "") return "dist/index.html";
                if (slug === "404") return "dist/404.html";
                return `dist/${slug}/index.html`;
              });

            // Files the build always emits, plus anything in src/static.
            const always = ["dist/sitemap.xml", "dist/robots.txt"];
            const statics = fs.existsSync("src/static")
              ? fs.readdirSync("src/static", { recursive: true })
                  .filter((f) => fs.statSync(path.join("src/static", f)).isFile())
                  .map((f) => path.join("dist", f))
              : [];

            const missing = [...expected, ...always, ...statics]
              .filter((f) => !fs.existsSync(f) || fs.statSync(f).size === 0);

            if (missing.length) {
              for (const f of missing) console.error(`::error::missing or empty: ${f}`);
              process.exit(1);
            }
            console.log(`${expected.length} pages + ${always.length + statics.length} other files, all present.`);
          '

      - name: Check redirect rules can't loop
        run: |
          node -e '
            const fs = require("fs");
            const file = "dist/_redirects";
            if (!fs.existsSync(file)) { console.log("no _redirects file"); process.exit(0); }

            let bad = 0;
            const lines = fs.readFileSync(file, "utf8").split("\n");
            lines.forEach((raw, i) => {
              const line = raw.trim();
              if (!line || line.startsWith("#")) return;
              const [from, to] = line.split(/\s+/);
              if (!from || !to) return;

              // A rule pointing a path at itself is an infinite redirect loop.
              // Query strings are not matched, so "/?foo=1" collapses to "/".
              const fromPath = from.split("?")[0];
              if (fromPath === to) {
                console.error(`::error file=src/static/_redirects,line=${i + 1}::redirect loop: "${from}" -> "${to}"`);
                bad++;
              }
              if (from.includes("?")) {
                console.error(`::error file=src/static/_redirects,line=${i + 1}::query strings are not matched in _redirects; "${from}" is treated as "${fromPath}"`);
                bad++;
              }
            });
            if (bad) process.exit(1);
            console.log("Redirect rules OK — no self-referential rules.");
          '

      - name: Validate structured data is parseable JSON
        run: |
          node -e '
            const fs = require("fs"), path = require("path");

            // Every built HTML page, found by walking dist/ — no fixed list.
            const files = [];
            (function walk(d) {
              for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                const p = path.join(d, e.name);
                if (e.isDirectory()) walk(p);
                else if (p.endsWith(".html")) files.push(p);
              }
            })("dist");

            let bad = 0;
            for (const f of files) {
              const html = fs.readFileSync(f, "utf8");
              const m = html.match(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/);
              if (!m) { console.error(`::error::no JSON-LD in ${f}`); bad++; continue; }
              try { JSON.parse(m[1]); } catch (e) {
                console.error(`::error::invalid JSON-LD in ${f}: ${e.message}`); bad++;
              }
            }
            if (bad) process.exit(1);
            console.log(`JSON-LD valid in all ${files.length} pages.`);
          '

      - name: Check for broken internal links
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const root = "dist";
            const pages = [];
            (function walk(d){ for (const e of fs.readdirSync(d,{withFileTypes:true})) {
              const p = path.join(d,e.name);
              if (e.isDirectory()) walk(p); else if (p.endsWith(".html")) pages.push(p);
            }})(root);

            const exists = (href) => {
              const clean = href.split("#")[0].split("?")[0];
              if (!clean || clean === "/") return fs.existsSync("dist/index.html");
              const base = path.join(root, clean);
              return fs.existsSync(base)
                  || fs.existsSync(base + ".html")
                  || fs.existsSync(path.join(base, "index.html"));
            };

            let broken = 0;
            for (const p of pages) {
              const html = fs.readFileSync(p, "utf8");
              for (const m of html.matchAll(/(?:href|src)="(\/[^"]*)"/g)) {
                if (!exists(m[1])) { console.error(`::error file=${p}::broken link ${m[1]}`); broken++; }
              }
            }
            if (broken) process.exit(1);
            console.log(`Checked ${pages.length} pages, no broken internal links.`);
          '

      - name: Report page weight
        run: |
          echo "### Page sizes" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find dist -name '*.html' -printf '%s\t%p\n' | sort -rn | \
            awk '{printf "%6.1f KB  %s\n", $1/1024, $2}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
